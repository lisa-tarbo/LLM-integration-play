# Hooks run in their own pre-commit-managed environments, so nbqa, ruff, black
# and detect-secrets do not need to be installed in .venv.
default_language_version:
  python: python3.12
repos:
  # File hygiene: whitespace, EOF, merge markers, JSON/YAML validity, large files,
  # LF line endings. no-commit-to-branch blocks direct commits to main.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-json
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: no-commit-to-branch
        args: [--branch, main]

  # Strip output from Jupyter notebooks (reduce noise in diffs, reduce repo size)
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        files: \.ipynb$

  # Python linters and formatters for Jupyter notebooks
  # nbqa-ruff only checks (fix manually, see AGENTS.md); nbqa-black rewrites the
  # notebook, so re-stage and commit again after it runs.
  # Ruff rules (I, UP, B, BLE) and notebook ignores (E402, F401, F811) live in ruff.toml
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-ruff
        files: \.ipynb$
      - id: nbqa-black
        files: \.ipynb$

  # Scan for secrets against .secrets.baseline
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
